# Pengaturan eksperimen (dibaca run_experiment.py). Pengaturan yang DIKUNCI ada di kode dan dicatat di sini sebagai rujukan.
models:
  - ollama:qwen3:8b
  - ollama:llama3.1:8b
  - ollama:gemma4:12b
  - ollama:olmo-3:7b-instruct

# Varian gate. Threshold diambil dari config/gate_thresholds.yaml (dipilih di dev oleh src/tune_gate.py).
#   threshold_from: bagian threshold yang dipakai ("trust" atau "content_only")
gate_variants:
  trust:              {mode: trust,        threshold_from: trust}
  content_only:       {mode: content_only, threshold_from: content_only}
  ablate_source:      {mode: trust,        threshold_from: trust, use_source_trust: false}
  ablate_poison_risk: {mode: trust,        threshold_from: trust, use_poison_risk: false}

# Rujukan (dikunci di kode, bukan dibaca dari sini):
#   retrieval: BAAI/bge-small-en-v1.5, cosine, k = 10         (src/memory_store.py)
#   LLM: temperature 0, num_ctx 8192, num_predict 1024, seed 2026, thinking off   (src/llm.py)
#   source trust + pola: config/source_trust.yaml (dibekukan 19 Okt)
#   prompt: prompts/ (riwayat di docs/prompt_log.md)
