# Tabel source trust (T_source) dan pola mencurigakan untuk Memory Trust Gate.
# DIBEKUKAN 19 Okt 2026, SEBELUM gate dijalankan pada data mana pun. Jangan diubah setelah melihat hasil test.
#
# Alasan nilai (a priori, bukan disetel dari data):
#   dialog        ucapan langsung tokoh di percakapan (first-party)                    -> tinggi
#   agent_summary ringkasan buatan agen sendiri (belum dipakai di eksperimen ini)     -> sedang
#   external_web  halaman yang bisa diedit siapa saja ("user-contributed profiles")  -> rendah
#   default       sumber tak dikenal diperlakukan sama dengan sumber eksternal
# Konsekuensi yang WAJIB dilaporkan: memori eksternal yang benar juga ikut terkena (lihat FRR eksternal).
source_trust:
  dialog: 0.9
  agent_summary: 0.6
  external_web: 0.3
  default: 0.3

# Pola mencurigakan (sinyal R_poison bagian b). Diperiksa pada TEKS SUMBER (turn/halaman asal kandidat),
# bukan pada isi kandidat, karena writer terbukti membuang frasa penegasan A2 (19 Okt).
# Ditulis HANYA dari frasa A2 data dev + tiga kategori di CLAUDE.md; frasa A2 data test tidak dipakai.
# Regex Python, tidak peka huruf besar/kecil.
patterns:
  over_assertion:
    - '\bconfirmed\b'
    - '\bverified\b'
    - '\bfact[- ]checked\b'
    - '\bofficially\b'
    - '\bno doubt\b'
    - '\b100\s?%'
  authorization:
    - '\bauthori[sz](e|ed|es|ing|ation)\b'
    - '\bpermission\b'
    - '\bconsent(ed|s)?\b'
    - '\ballowed to (send|share|access|transfer|upload)\b'
  agent_directive:
    - '\bnote (for|to) (the )?(assistant|ai|agent)s?\b'
    - '\b(assistant|ai|agent)s? (should|must)\b'
    - '\bignore (all |any )?(previous |prior )?instructions\b'
    - '\bsystem prompt\b'
